<div class="min-h-screen bg-[#0B0E14] px-6 py-8 max-w-3xl mx-auto">

  <div class="flex items-center justify-between mb-4">
    <h2 class="text-2xl font-medium text-[#E4E6EB]">Forum</h2>
    <button (click)="showAddForm = !showAddForm; selectedPost = null"
            class="bg-[#8B5CF6] hover:bg-[#7C3AED] text-white rounded-lg
                   px-4 py-2 text-sm font-medium transition-colors">
      {{ showAddForm ? 'Cancel' : '+ New post' }}
    </button>
  </div>

  <!-- ✅ Onglets Recent / For You -->
  <div class="flex gap-2 mb-6 border-b border-[rgba(139,92,246,0.2)]">
    <button (click)="switchTab('recent')"
            class="px-4 py-2 text-sm font-medium transition-colors border-b-2"
            [class]="activeTab === 'recent'
              ? 'border-[#8B5CF6] text-[#8B5CF6]'
              : 'border-transparent text-[#9CA3AF] hover:text-[#E4E6EB]'">
      🕐 Recent
    </button>
    <button (click)="switchTab('foryou')"
            class="px-4 py-2 text-sm font-medium transition-colors border-b-2"
            [class]="activeTab === 'foryou'
              ? 'border-[#8B5CF6] text-[#8B5CF6]'
              : 'border-transparent text-[#9CA3AF] hover:text-[#E4E6EB]'">
      ✨ For You
    </button>
  </div>

  <app-add-post
    *ngIf="showAddForm && !selectedPost"
    [postToEdit]="null"
    (refresh)="clearSelection()">
  </app-add-post>

  <div *ngFor="let post of posts" class="mb-4">

    <app-add-post
      *ngIf="selectedPost?.id === post.id"
      [postToEdit]="selectedPost"
      (refresh)="clearSelection()">
    </app-add-post>

    <div *ngIf="selectedPost?.id !== post.id"
         class="bg-[#141920] border border-[rgba(139,92,246,0.2)] rounded-xl p-5">

      <div class="flex items-start gap-3 mb-3">
        <div class="w-8 h-8 rounded-full bg-[#8B5CF6]/20 border border-[#8B5CF6]/30
                    flex items-center justify-center flex-shrink-0">
          <span class="text-xs font-medium text-[#8B5CF6]">
            {{ post.authorUsername ? post.authorUsername.charAt(0).toUpperCase() : '?' }}
          </span>
        </div>

        <div class="flex-1">
  <div class="flex items-center gap-2 flex-wrap">
    <h3 class="text-lg font-medium text-[#E4E6EB]">{{ post.titre }}</h3>

    <!-- ✅ Badge WARNING -->
    <span *ngIf="post.toxicityLevel === 'WARNING'"
          class="text-xs px-2 py-0.5 rounded-full bg-amber-900/30
                 text-amber-400 border border-amber-500/30">
      ⚠️ Under review
    </span>

    <!-- ✅ Badge HIDDEN -->
    <span *ngIf="post.toxicityLevel === 'HIDDEN'"
          class="text-xs px-2 py-0.5 rounded-full bg-red-900/30
                 text-red-400 border border-red-500/30">
      🔒 Hidden
    </span>
  </div>

  <span class="text-xs text-[#9CA3AF]/60">
    By <span class="text-[#8B5CF6]">{{ post.authorUsername }}</span>
    · {{ post.datePublication | date:'dd/MM/yyyy' }}
  </span>
</div>

        <div class="flex gap-2 flex-shrink-0">
          <button *ngIf="isOwner(post)" (click)="editPost(post)"
                  class="text-xs px-3 py-1.5 bg-[#252B38] hover:bg-[#1E2530]
                         text-[#E4E6EB] rounded-lg transition-colors">
            Update
          </button>
          <button *ngIf="isOwner(post)" (click)="deletePost(post.id!)"
                  class="text-xs px-3 py-1.5 bg-red-900/30 hover:bg-red-900/50
                         text-red-400 rounded-lg transition-colors">
            Delete
          </button>
        </div>
      </div>

      <p class="text-[#9CA3AF] text-sm leading-relaxed mb-3 ml-11">
        {{ post.contenu }}
      </p>

      <img *ngIf="post.imageUrl"
           [src]="post.imageUrl"
           class="w-full mt-2 mb-3 rounded-lg object-contain max-h-96
                  border border-[rgba(139,92,246,0.1)]"/>

      <div class="border-t border-[rgba(139,92,246,0.1)] pt-3 ml-11 flex items-center gap-4 flex-wrap">

        <app-emoji-reaction-bar
          [postId]="post.id!"
          [reactionCounts]="post.reactionCounts || {}"
          [initialUserReaction]="post.userReaction || null">
        </app-emoji-reaction-bar>

        <button (click)="toggleComments(post.id!)"
                class="flex items-center gap-2 text-xs text-[#9CA3AF]
                       hover:text-[#8B5CF6] transition-colors">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4"
               viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
          </svg>
          <span>
            {{ isExpanded(post.id!) ? 'Hide Comments' : (post.commentCount || 0) + ' comments' }}
          </span>
        </button>

        <span class="flex items-center gap-1 text-xs text-[#9CA3AF]/60">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-3.5 h-3.5"
               fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
            <path d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>
          </svg>
          {{ post.vues || 0 }} views
        </span>
      </div>

      <div *ngIf="isExpanded(post.id!)" class="ml-11">
  <app-commentaires
    [postId]="post.id!"
    [postAuthorUsername]="post.authorUsername || ''"
    (commentAdded)="loadPostsWithStats()">
  </app-commentaires>
</div>
    </div>
  </div>

  <p *ngIf="posts.length === 0"
     class="text-center text-[#9CA3AF] text-sm py-12">
    No posts yet. Be the first to publish!
  </p>

</div>
