server.port=8090

# MongoDB Configuration
spring.data.mongodb.uri=mongodb://localhost:27017/content_management_db
spring.data.mongodb.database=content_management_db

# No JPA configuration needed (MongoDB, not SQL)
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false

# Swagger/OpenAPI Configuration
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
springdoc.api-docs.enabled=true

# JWT Configuration
app.jwtSecret=mySecretKeyForJWTTokenProviderApplicationShouldBeAtLeastThirtyTwoCharactersLongForHS256Algorithm
app.jwtExpirationMs=86400000

# Stripe payment configuration
app.payment.stripe.secret-key=
app.payment.default-success-url=http://localhost:4200/admin/cinema?module=reservations&paymentSuccess=1
app.payment.default-cancel-url=http://localhost:4200/admin/cinema?module=reservations&paymentCanceled=1

# Optional SMTP configuration for waitlist email notifications.
# Set these values in your environment or replace them with your provider details.
spring.mail.host=${SMTP_HOST:}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:true}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

app.mail.from=${SMTP_FROM:no-reply@smgo.local}

# FastAPI ML Service Configuration
fastapi.url=http://localhost:8000
