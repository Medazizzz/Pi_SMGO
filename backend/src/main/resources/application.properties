server.port=8090

# MongoDB Configuration
spring.data.mongodb.uri=mongodb://localhost:27017/content_management_db
spring.data.mongodb.database=content_management_db

# Load local environment overrides when the app is started outside the helper scripts.
spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties]

# No JPA configuration needed (MongoDB, not SQL)
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false

# Swagger/OpenAPI Configuration
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
springdoc.api-docs.enabled=true

# JWT Configuration
app.jwtSecret=mySecretKeyForJWTTokenProviderApplicationShouldBeAtLeastThirtyTwoCharactersLongForHS256Algorithm
app.jwtExpirationMs=86400000

# Content scheduler configuration
app.content.scheduler.enabled=true
app.content.scheduler.cron=0/15 * * * * *

# Python XGBoost recommendation service
app.ai.recommendation-base-url=http://localhost:5055

# Multi-channel delivery strategy (in-app first, then email if unread)
app.notifications.email-fallback-enabled=true
app.notifications.email-fallback-delay-seconds=${EMAIL_FALLBACK_DELAY_SECONDS:15}
app.notifications.email-fallback-check-interval-ms=10000
app.notifications.email-from=${SMTP_FROM:${SMTP_USERNAME:no-reply@smgo.local}}

# Scheduled newsletter campaigns (in-app + email at scheduled time)
app.newsletters.scheduler-check-interval-ms=30000


# SMTP configuration (load real credentials from environment variables)
spring.mail.host=${SMTP_HOST:smtp.gmail.com}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:true}
